version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: orbit-postgres
    restart: always
    environment:
      POSTGRES_USER: orbit_user
      POSTGRES_PASSWORD: orbit_password_2026
      POSTGRES_DB: orbit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: orbit-api
    restart: always
    environment:
      DATABASE_URL: postgresql://orbit_user:orbit_password_2026@db:5432/orbit_db
      SECRET_KEY: orbit-production-docker-secret-key-32bytes
      DEBUG: "true"
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
